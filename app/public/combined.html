<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电力谈判桌 · 数字孪生 + 人工/AI 对比</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    html, body { margin: 0; background: #04080e; }
    .stage-frame {
      display: block;
      width: 100%;
      height: 100vh;
      border: 0;
      background: #04080e;
    }
    .scroll-cue {
      position: fixed;
      right: 26px;
      bottom: 22px;
      z-index: 100;
      padding: 10px 16px;
      border: 1px solid rgba(0, 229, 255, 0.6);
      border-radius: 999px;
      background: rgba(4, 14, 22, 0.82);
      color: #00e5ff;
      font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.04em;
      text-decoration: none;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 26px rgba(0, 229, 255, 0.25);
    }
    .scroll-cue:hover { background: rgba(0, 229, 255, 0.16); }
    .bench-wrap {
      padding-top: 0;
      padding-bottom: 70px;
      background:
        radial-gradient(80% 40% at 50% 0%, rgba(0, 229, 255, 0.06), transparent 70%),
        #070a0f;
      border-top: 1px solid rgba(0, 229, 255, 0.16);
    }
    .bench-topline {
      display: flex;
      justify-content: flex-end;
      padding-top: 26px;
    }
    .bench-back {
      color: #8b97a8;
      font-size: 12px;
      text-decoration: none;
      border-bottom: 1px dashed rgba(139, 151, 168, 0.4);
    }
    .bench-back:hover { color: #00e5ff; border-color: #00e5ff; }
    #sandbox { height: 0; overflow: hidden; }
    @media (max-width: 760px) {
      .scroll-cue { right: 12px; bottom: 12px; }
    }
  </style>
</head>
<body>
  <iframe class="stage-frame" src="/twin.html?embed=1" title="数字孪生主页面"></iframe>

  <a class="scroll-cue" href="#bench"
     onclick="document.getElementById('bench').scrollIntoView({behavior:'smooth'});this.style.display='none';return false;">
    ↓ 人工 vs AI 对比
  </a>

  <main class="shell bench-wrap" id="bench">
    <div class="bench-topline">
      <a class="bench-back" href="#top"
         onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">↑ 回到数字孪生</a>
    </div>
    <!-- compare.js 在这里插入人工 vs AI 对比 -->
    <div id="sandbox"></div>
  </main>

  <script src="/compare.js"></script>
  <script>
    if (location.search.includes('play=1')) {
      document.querySelector('.stage-frame').src = '/twin.html?embed=1&play=1';
    }
  </script>
</body>
</html>
